name: Build

# Only when you publish a version (push a tag like v1.0.0) or run it by hand.
# Keeps the Actions tab quiet for normal pushes.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Needed to attach the APKs to the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up release signing
        # Writes the keystore and keystore.properties from repository secrets so
        # the release APK is signed with the real key instead of the debug key.
        # Without the secrets the build still works (falls back to debug signing).
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is not set; the APK will be signed with the debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > fossfiles-release.jks
          {
            echo "storeFile=fossfiles-release.jks"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > keystore.properties

      - name: Build the builder image (JDK + Android SDK)
        run: docker build -f Containerfile -t fossfiles-builder:latest .

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: .container/gradle
          # Static key on purpose: it never calls hashFiles(), which failed on
          # CI when it had to walk directories created by the build
          # ("Fail to hash files under directory ..."). Bump the -v1 suffix
          # whenever you want to refresh the cache.
          key: gradle-${{ runner.os }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        env:
          ENGINE: docker
        run: ./build-in-container.sh testDebugUnitTest

      - name: Build release APKs
        env:
          ENGINE: docker
        run: ./build-in-container.sh assembleRelease

      - name: Upload APKs (run artifact)
        uses: actions/upload-artifact@v7
        with:
          name: fossfiles-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to the GitHub Release
        # On a manual run this is skipped; on a tag push it publishes the release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk

      - name: Remove signing material
        # The runner is ephemeral, but do not leave the keystore around.
        if: always()
        run: rm -f fossfiles-release.jks keystore.properties
