name: Build

# Only when you publish a version (push a tag like v1.0.0) or run it by hand.
# Keeps the Actions tab quiet for normal pushes.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Needed to attach the APKs to the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build the builder image (JDK + Android SDK)
        run: docker build -f Containerfile -t fossfiles-builder:latest .

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: .container/gradle
          # Static key on purpose: it never calls hashFiles(), which failed on
          # CI when it had to walk directories created by the build
          # ("Fail to hash files under directory ..."). Bump the -v1 suffix
          # whenever you want to refresh the cache.
          key: gradle-${{ runner.os }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        env:
          ENGINE: docker
        run: ./build-in-container.sh testDebugUnitTest

      - name: Build release APKs
        env:
          ENGINE: docker
        run: ./build-in-container.sh assembleRelease

      - name: Upload APKs (run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fossfiles-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to the GitHub Release
        # On a manual run this is skipped; on a tag push it publishes the release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
